name: Refresh profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # once a day, ~11:47 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap.py
      - run: python scripts/render_stats.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contrib-heatmap.svg assets/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "Refresh contribution graph [skip ci]"
          git push
